profile: hil
sample_time_ms: 10.0
model_path: "models/ev_controller/EV_Controller_HIL.xil"

backend_settings:
  mock_mode: true  # Emulates CAN bus network & ECU firmware timing if physical hardware is absent
  can_channel: "vcan0"
  can_bustype: "virtual"
  can_bitrate: 500000
  max_torque_nm: 350.0
  communication_delay_ms: 2.0
  interlock_active_high: true
  restbus:
    cycle_period_ms: 20.0
    nodes:
      ABS:
        cycle_period_ms: 10.0
        signals:
          ESP_Status: 1.0
          WheelSpeed_FL: 0.0
          WheelSpeed_FR: 0.0
          Brake_Plausibility: 1.0
      BMS:
        cycle_period_ms: 20.0
        signals:
          SOC: 80.0
          Voltage: 350.0
          Temperature: 25.0
      MCU:
        cycle_period_ms: 20.0
        signals:
          Motor_Temp: 35.0
          Inverter_Temp: 30.0
          Actual_Torque: 0.0
      TCU:
        cycle_period_ms: 50.0
        signals:
          Selected_Gear: 1.0
          Clutch_Pressure: 0.0
      Cluster:
        cycle_period_ms: 100.0
        signals:
          Odometer: 12500.0
          DriveMode: 1.0
          AmbientTemp: 25.0

maport:
  Throttle_Input: "Speedgoat/Plant/Pedal_Position"
  Brake_Interlock: "Speedgoat/Plant/HV_Interlock_Pin"

network_port:
  VehicleSpeed_CAN: "CAN1/Msg0x200/VehicleSpeed"
  TorqueRequest_CAN: "CAN1/Msg0x200/TorqueRequest"

ecu_port:
  ECU_State: "ECU/OperatingState"
  ECU_DiagnosticStatus: "ECU/DTC_Status"

signals:
  Throttle_Input: "Speedgoat/Plant/Pedal_Position"
  Brake_Interlock: "Speedgoat/Plant/HV_Interlock_Pin"
  Motor_Torque: "CAN1/Msg0x200/TorqueRequest"
  Vehicle_Speed: "CAN1/Msg0x200/VehicleSpeed"
  VehicleSpeed_CAN: "CAN1/Msg0x200/VehicleSpeed"
  TorqueRequest_CAN: "CAN1/Msg0x200/TorqueRequest"
  ECU_State: "ECU/OperatingState"
  ECU_DiagnosticStatus: "ECU/DTC_Status"
