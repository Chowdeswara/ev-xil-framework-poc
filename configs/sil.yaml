profile: sil
sample_time_ms: 10.0
model_path: "build/ev_controller_sil.dll"

backend_settings:
  mock_mode: true # Uses a lightweight virtual C-runtime simulation if DLL is not compiled
  max_torque_nm: 350.0
  interlock_active_high: true
  task_period_ms: 10.0

signals:
  Throttle_Input: "EV_Controller_U.Throttle_Pedal_In"
  Brake_Interlock: "EV_Controller_U.HV_Interlock_State"
  Motor_Torque: "EV_Controller_Y.Target_Torque_Out"
  Vehicle_Speed: "EV_Plant_Y.Vehicle_Speed_Kmh"
